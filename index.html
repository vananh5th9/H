<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tool Dự Đoán Tài Xỉu - Gọi 100ms</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #000;
        }

        .game-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        .floating-tool {
            position: fixed;
            z-index: 9999;
            width: 320px;
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 193, 7, 0.4);
            transition: box-shadow 0.2s;
            cursor: default;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: linear-gradient(135deg, #1f2e3a, #0f1a22);
            border-radius: 28px 28px 20px 20px;
            cursor: grab;
            border-bottom: 1px solid #ffb34766;
        }
        .tool-header:active {
            cursor: grabbing;
        }
        .robot-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .robot-icon {
            font-size: 32px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            color: #ffb347;
        }
        .title-text {
            font-weight: bold;
            color: #ffe6c7;
            letter-spacing: 1px;
            font-size: 1rem;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .header-actions button {
            background: none;
            border: none;
            color: #dddddd;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:hover {
            background: #2c4c66;
            color: #ffaa33;
        }
        .tool-content {
            padding: 16px 18px 20px;
            transition: transform 0.25s ease;
            transform-origin: center center;
        }
        .tool-content.rotated-90 {
            transform: rotate(90deg);
        }
        .predict-status {
            text-align: center;
            font-size: 0.75rem;
            color: #bcbcbc;
            margin-bottom: 10px;
            background: #00000055;
            border-radius: 60px;
            padding: 4px 8px;
            display: inline-block;
            width: 100%;
        }
        .result-box {
            background: #05161fcc;
            border-radius: 36px;
            padding: 16px 8px;
            margin: 12px 0;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 1px solid #ffaa4455;
        }
        .prediction-big {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffd966, #ff8c42);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px #ff8800aa;
            margin: 5px 0;
        }
        .detail-info {
            font-size: 0.7rem;
            color: #bbd4f0;
            border-top: 1px dashed #4e6e88;
            margin-top: 12px;
            padding-top: 10px;
            word-break: break-word;
        }
        .btn-refresh {
            background: #f0a500;
            border: none;
            width: 100%;
            padding: 12px 0;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #1e2f3c;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-refresh:hover {
            background: #ffbc3c;
            transform: scale(0.98);
        }
        .footer-note {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 12px;
            color: #7e9bb0;
        }
        @media (max-width: 550px) {
            .floating-tool { width: 280px; }
            .prediction-big { font-size: 2rem; }
        }
    </style>
</head>
<body>

<iframe class="game-frame" src="https://lc79.bet" title="LC79 Game" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

<div id="floatingTool" class="floating-tool" style="top: 80px; right: 20px;">
    <div class="tool-header" id="dragHeader">
        <div class="robot-area">
            <i class="fas fa-robot robot-icon"></i>
            <span class="title-text">DỰ ĐOÁN TÀI XỈU</span>
        </div>
        <div class="header-actions">
            <button id="rotateBtn" title="Xoay 90°"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>
    <div class="tool-content" id="toolContent">
        <div id="statusMsg" class="predict-status">
            <i class="fas fa-spinner fa-pulse"></i> Đang quét liên tục (100ms)...
        </div>
        <div class="result-box">
            <div style="font-size:0.8rem; opacity:0.8;">🔮 DỰ ĐOÁN TIẾP THEO 🔮</div>
            <div id="predictionValue" class="prediction-big">---</div>
            <div id="extraInfo" style="font-size:0.7rem; margin-top:6px;">⚡ Chờ phân tích</div>
        </div>
        <div id="analysisDetail" class="detail-info">
            📡 Cập nhật liên tục mỗi 100ms...
        </div>
        <button id="manualFetchBtn" class="btn-refresh">
            <i class="fas fa-chart-line"></i> DỰ ĐOÁN NGAY
        </button>
        <div class="footer-note">
            <i class="fas fa-arrows-alt"></i> Kéo thả di chuyển | <i class="fas fa-undo-alt"></i> Xoay 90°
        </div>
    </div>
</div>

<script>
    // ======================== API & LOGIC DỰ ĐOÁN ========================
    const API_URL = "https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=355f5391f1326f7cd9fa2ce5b8663d92";
    
    // Cờ để tránh gọi chồng chéo (do 100ms rất nhanh)
    let isFetching = false;
    let lastPredictionHtml = ""; // chỉ cập nhật giao diện khi thay đổi để tránh giật

    function extractNumberFromLast4Id(idStr) {
        if (!idStr || idStr.length < 4) return 0;
        const last4 = idStr.slice(-4);
        const digits = last4.match(/\d/g);
        if (!digits) return 0;
        const combined = digits.join('');
        return combined === '' ? 0 : parseInt(combined, 10);
    }
    
    function isEven(num) {
        return num % 2 === 0;
    }
    
    function predictNext(prevResult, idNumber, thirdDice) {
        if (!prevResult) return "???";
        const sameParity = (isEven(idNumber) === isEven(thirdDice));
        if (sameParity) return prevResult;
        else return prevResult === "TAI" ? "XIU" : "TAI";
    }
    
    async function fetchAndUpdatePrediction() {
        if (isFetching) return; // bỏ qua nếu đang fetch
        isFetching = true;
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            
            if (!data || !data.list || data.list.length === 0) throw new Error("No data");
            
            const latest = data.list[0];
            const idRaw = latest._id;
            const dices = latest.dices;
            const point = latest.point;
            const resultTruyenThong = latest.resultTruyenThong;
            
            if (!dices || dices.length < 3) throw new Error("Invalid dice");
            const thirdDice = dices[2];
            const numberFromId = extractNumberFromLast4Id(idRaw);
            const predicted = predictNext(resultTruyenThong, numberFromId, thirdDice);
            
            // Tạo nội dung mới để so sánh
            const idParity = isEven(numberFromId) ? "Chẵn" : "Lẻ";
            const diceParity = isEven(thirdDice) ? "Chẵn" : "Lẻ";
            const same = (isEven(numberFromId) === isEven(thirdDice));
            const giuDao = same ? "GIỮ NGUYÊN" : "ĐẢO NGƯỢC";
            
            const newPredictionHtml = predicted;
            const newExtraHtml = `📊 ${numberFromId} (${idParity}) vs 🎲${thirdDice} (${diceParity}) → ${giuDao} → KQ cũ: ${resultTruyenThong}`;
            const newDetailHtml = `
                <div><i class="fas fa-dice-d6"></i> <strong>Lượt ID:</strong> ${idRaw}</div>
                <div><i class="fas fa-code"></i> 4 cuối: <code>${idRaw.slice(-4)}</code> → lọc số → <b>${numberFromId}</b> (${idParity})</div>
                <div><i class="fas fa-cubes"></i> Bộ xí ngầu: [${dices.join(', ')}] → viên 3 = ${thirdDice} (${diceParity})</div>
                <div><i class="fas fa-chart-simple"></i> Kết quả cũ: <span style="background:#0e2a36;padding:2px 8px;border-radius:30px;">${resultTruyenThong} (${point} điểm)</span></div>
                <div><i class="fas fa-arrow-right"></i> So sánh: <b>${same ? 'TRÙNG' : 'KHÁC'}</b> → ${giuDao} → <strong style="color:#FFB347;">DỰ ĐOÁN: ${predicted}</strong></div>
                <div><i class="fas fa-clock"></i> Cập nhật: ${new Date().toLocaleTimeString()}</div>
            `;
            
            // Cập nhật giao diện (chỉ khi thay đổi để tránh nhấp nháy)
            const predDiv = document.getElementById('predictionValue');
            const extraSpan = document.getElementById('extraInfo');
            const detailDiv = document.getElementById('analysisDetail');
            const statusDiv = document.getElementById('statusMsg');
            
            if (predDiv.innerText !== newPredictionHtml) predDiv.innerText = newPredictionHtml;
            if (extraSpan.innerText !== newExtraHtml) extraSpan.innerText = newExtraHtml;
            if (detailDiv.innerHTML !== newDetailHtml) detailDiv.innerHTML = newDetailHtml;
            statusDiv.innerHTML = `⚡ 100ms polling | ${new Date().toLocaleTimeString()} | Dự đoán: ${predicted}`;
            
        } catch (error) {
            console.warn("Fetch error:", error);
            // Không spam lỗi lên giao diện quá nhiều, chỉ thỉnh thoảng
            const statusDiv = document.getElementById('statusMsg');
            if (!statusDiv.innerText.includes("Lỗi")) {
                statusDiv.innerHTML = `⚠️ Lỗi: ${error.message} (thử lại ngay)`;
            }
        } finally {
            isFetching = false;
        }
    }
    
    // ======================== KÉO THẢ TOOL ========================
    const tool = document.getElementById('floatingTool');
    const dragHeader = document.getElementById('dragHeader');
    
    let isDragging = false;
    let offsetX = 0, offsetY = 0;
    
    function onMouseDown(e) {
        if (e.target.closest('.header-actions')) return;
        isDragging = true;
        const rect = tool.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        tool.style.cursor = 'grabbing';
        e.preventDefault();
    }
    
    function onMouseMove(e) {
        if (!isDragging) return;
        let newLeft = e.clientX - offsetX;
        let newTop = e.clientY - offsetY;
        const maxX = window.innerWidth - tool.offsetWidth;
        const maxY = window.innerHeight - tool.offsetHeight;
        newLeft = Math.min(Math.max(0, newLeft), maxX);
        newTop = Math.min(Math.max(0, newTop), maxY);
        tool.style.left = newLeft + 'px';
        tool.style.top = newTop + 'px';
        tool.style.right = 'auto';
    }
    
    function onMouseUp() {
        isDragging = false;
        tool.style.cursor = '';
    }
    
    dragHeader.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    
    // ======================== XOAY 90 ĐỘ ========================
    const rotateBtn = document.getElementById('rotateBtn');
    const toolContent = document.getElementById('toolContent');
    let rotationDeg = 0;
    rotateBtn.addEventListener('click', () => {
        rotationDeg = (rotationDeg + 90) % 360;
        if (rotationDeg === 90 || rotationDeg === 270) {
            toolContent.classList.add('rotated-90');
        } else {
            toolContent.classList.remove('rotated-90');
        }
        if (rotationDeg === 90 || rotationDeg === 270) {
            tool.style.width = 'auto';
            tool.style.minWidth = '280px';
        } else {
            tool.style.width = '320px';
        }
    });
    
    // ======================== GỌI LIÊN TỤC 100ms ========================
    let pollingInterval = null;
    
    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        // Gọi ngay lập tức
        fetchAndUpdatePrediction();
        // Sau đó đặt interval 100ms
        pollingInterval = setInterval(() => {
            fetchAndUpdatePrediction();
        }, 100);  // 100 mili giây
    }
    
    function stopPolling() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
            pollingInterval = null;
        }
    }
    
    // Nút bấm thủ công vẫn hoạt động và không ảnh hưởng đến polling
    const manualBtn = document.getElementById('manualFetchBtn');
    manualBtn.addEventListener('click', () => {
        fetchAndUpdatePrediction();
    });
    
    // Khởi động polling khi trang load
    window.addEventListener('load', () => {
        startPolling();
    });
    
    // Dọn dẹp khi rời trang (tốt)
    window.addEventListener('beforeunload', () => {
        stopPolling();
    });
    
    // Nếu tab ẩn, vẫn giữ polling (không tắt) vì yêu cầu "liên tục"
    // Bạn có thể muốn giảm tần suất khi ẩn, nhưng theo yêu cầu thì cứ giữ 100ms.
</script>
</body>
</html>
