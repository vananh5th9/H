<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LC79.bet + Tool ETag Tài Xỉu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, monospace;
        }

        /* iframe chiếm toàn bộ màn hình */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Floating box - box nổi nhỏ */
        .floating-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid rgba(255, 165, 0, 0.5);
            box-shadow: 0 10px 28px rgba(0,0,0,0.5);
            z-index: 9999;
            color: #fff;
            transition: 0.2s;
            font-size: 14px;
            cursor: move;
        }

        .floating-box h4 {
            margin: 0 0 12px 0;
            font-size: 1rem;
            color: #facc15;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .floating-box h4 span {
            cursor: pointer;
            background: #334155;
            padding: 0 8px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .floating-box input {
            width: 100%;
            padding: 8px 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 40px;
            color: white;
            font-family: monospace;
            font-size: 0.75rem;
            margin: 8px 0;
        }

        .floating-box button {
            width: 100%;
            background: #f97316;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            color: #0f172a;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }

        .floating-box button:hover {
            background: #fdba74;
        }

        .result-area {
            margin-top: 14px;
            padding: 10px;
            background: #0f172a;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
        }

        .prediction {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .tai {
            color: #4ade80;
            text-shadow: 0 0 4px #22c55e;
        }
        .xiu {
            color: #f87171;
            text-shadow: 0 0 4px #ef4444;
        }

        .small-note {
            font-size: 0.6rem;
            text-align: center;
            color: #94a3b8;
            margin-top: 10px;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.7rem;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<iframe src="https://lc79.bet" title="LC79.bet" allow="autoplay; encrypted-media" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="floatingBox" class="floating-box">
    <h4 id="dragHandle">
        🔮 Tool ETag
        <span id="minimizeBtn" class="minimize-btn">−</span>
    </h4>
    <div id="boxContent">
        <input type="text" id="etagInput" placeholder="Dán ETag vào đây... ví dụ: W/&quot;60f-oTJt...&quot;">
        <div style="display: flex; gap: 8px;">
            <button id="fetchApiBtn" style="flex:2">📡 Lấy ETag từ API</button>
            <button id="analyzeBtn" style="flex:3">🔍 PHÂN TÍCH & DỰ ĐOÁN</button>
        </div>
        <div class="result-area" id="resultArea">
            Chưa phân tích
        </div>
        <div class="small-note">
            Thuật toán: lấy tổng các chữ số → chẵn = Xỉu, lẻ = Tài
        </div>
    </div>
</div>

<script>
    // Thuật toán: trích xuất tất cả số, tính tổng, chẵn => Xỉu, lẻ => Tài
    function predictFromETag(etag) {
        if (!etag) return null;
        const digits = etag.match(/\d/g);
        if (!digits || digits.length === 0) return null;
        let sum = 0;
        for (let d of digits) {
            sum += parseInt(d, 10);
        }
        return (sum % 2 === 0) ? "XỈU" : "TÀI";
    }

    // Hàm cập nhật kết quả dự đoán
    function updatePrediction(etag) {
        const resultArea = document.getElementById('resultArea');
        if (!etag) {
            resultArea.innerHTML = `<div>⚠️ Vui lòng nhập ETag</div>`;
            return;
        }
        const prediction = predictFromETag(etag);
        if (prediction === null) {
            resultArea.innerHTML = `<div class="error-msg">❌ Không tìm thấy chữ số trong ETag</div>`;
        } else {
            const className = prediction === "TÀI" ? "tai" : "xiu";
            resultArea.innerHTML = `
                <div style="font-size:0.7rem; opacity:0.8;">📊 Kết quả dự đoán</div>
                <div class="prediction ${className}">${prediction}</div>
                <div style="font-size:0.65rem; margin-top:4px;">(dựa trên tổng các chữ số)</div>
            `;
        }
    }

    // ====================== LẤY ETAG TỪ API QUA CORS PROXY ======================
    // Thêm proxy bọc bên ngoài để vượt qua cơ chế chặn CORS của trình duyệt
    const API_URL = "https://corsproxy.io/?" + encodeURIComponent("https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=84fd5cb3573d959ca81dddc15029d6e3");

    async function fetchETagFromAPI() {
        const fetchBtn = document.getElementById('fetchApiBtn');
        const originalText = fetchBtn.innerHTML;
        fetchBtn.innerHTML = '<span class="loading"></span> Đang lấy...';
        fetchBtn.disabled = true;

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // Tăng timeout lên 10s vì đi qua proxy trung gian
            const response = await fetch(API_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                    "Cache-Control": "no-cache"
                },
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            let etagValue = null;
            // Lấy ETag từ response headers (không phân biệt hoa thường)
            for (let pair of response.headers.entries()) {
                if (pair[0].toLowerCase() === 'etag') {
                    etagValue = pair[1];
                    break;
                }
            }
            
            if (etagValue) {
                // Tự động điền vào ô input
                const etagInput = document.getElementById('etagInput');
                etagInput.value = etagValue;
                updatePrediction(etagValue);
                // Hiển thị thông báo trong result area
                const resultArea = document.getElementById('resultArea');
                resultArea.innerHTML = `
                    <div style="font-size:0.7rem; opacity:0.8;">✅ Đã lấy ETag qua Proxy</div>
                    <div class="prediction ${predictFromETag(etagValue) === "TÀI" ? "tai" : "xiu"}">${predictFromETag(etagValue)}</div>
                    <div style="font-size:0.65rem; margin-top:4px;">ETag: ${etagValue.substring(0, 40)}...</div>
                `;
            } else {
                const resultArea = document.getElementById('resultArea');
                resultArea.innerHTML = `<div class="error-msg">⚠️ Proxy không trả về ETag trong header.<br>Hãy thử dán thủ công từ DevTools.</div>`;
            }
        } catch (error) {
            console.error(error);
            const resultArea = document.getElementById('resultArea');
            if (error.name === 'AbortError') {
                resultArea.innerHTML = `<div class="error-msg">⏰ Timeout: Proxy không phản hồi sau 10s</div>`;
            } else {
                resultArea.innerHTML = `<div class="error-msg">❌ Lỗi: ${error.message}<br>Hãy kiểm tra lại token hoặc dán thủ công</div>`;
            }
        } finally {
            fetchBtn.innerHTML = originalText;
            fetchBtn.disabled = false;
        }
    }

    // ====================== KHỞI TẠO SỰ KIỆN ======================
    const etagInput = document.getElementById('etagInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const fetchApiBtn = document.getElementById('fetchApiBtn');

    analyzeBtn.addEventListener('click', () => {
        let etag = etagInput.value.trim();
        updatePrediction(etag);
    });
    fetchApiBtn.addEventListener('click', () => {
        fetchETagFromAPI();
    });
    etagInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            analyzeBtn.click();
        }
    });

    // ====================== KÉO THẢ BOX ======================
    const floatingBox = document.getElementById('floatingBox');
    const dragHandle = document.getElementById('dragHandle');
    const minimizeBtn = document.getElementById('minimizeBtn');
    const boxContent = document.getElementById('boxContent');
    let isDragging = false;
    let offsetX, offsetY;

    // Thu nhỏ / mở rộng
    let isMinimized = false;
    function toggleMinimize() {
        if (isMinimized) {
            boxContent.style.display = 'block';
            minimizeBtn.innerText = '−';
            floatingBox.style.width = '320px';
            isMinimized = false;
        } else {
            boxContent.style.display = 'none';
            minimizeBtn.innerText = '+';
            floatingBox.style.width = 'auto';
            floatingBox.style.minWidth = '120px';
            isMinimized = true;
        }
    }
    minimizeBtn.addEventListener('click', toggleMinimize);

    // Kéo thả (chỉ khi kéo vào header)
    dragHandle.addEventListener('mousedown', (e) => {
        if (e.target === minimizeBtn || e.target.parentElement === minimizeBtn) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        isDragging = true;
        offsetX = e.clientX - floatingBox.offsetLeft;
        offsetY = e.clientY - floatingBox.offsetTop;
        floatingBox.style.cursor = 'grabbing';
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let left = e.clientX - offsetX;
        let top = e.clientY - offsetY;
        left = Math.min(window.innerWidth - floatingBox.offsetWidth, Math.max(0, left));
        top = Math.min(window.innerHeight - floatingBox.offsetHeight, Math.max(0, top));
        floatingBox.style.left = left + 'px';
        floatingBox.style.right = 'auto';
        
        floatingBox.style.bottom = 'auto';
        floatingBox.style.top = top + 'px';
    });

    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            floatingBox.style.cursor = 'default';
        }
    });
</script>
</body>
</html>
