<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dự Đoán Tài Xỉu - Xác Suất Chuẩn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', monospace;
            padding: 20px;
        }
        .card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 32px 28px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,180,60,0.3);
            text-align: center;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFD966, #FF8C42);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .sub {
            color: #b9d9ff;
            font-size: 0.75rem;
            margin-bottom: 24px;
            border-bottom: 1px dashed #ffb34755;
            display: inline-block;
            padding-bottom: 5px;
        }
        .ratio-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 30px 0;
        }
        .ratio-box {
            flex: 1;
            background: #0c1a22cc;
            border-radius: 48px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid #ffb347aa;
        }
        .ratio-label {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .tai-label { color: #ffaa66; }
        .xiu-label { color: #77ddff; }
        .percent {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(145deg, #fff, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .prediction-box {
            background: #000000aa;
            border-radius: 60px;
            padding: 12px;
            margin: 20px 0;
        }
        .prediction-text {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
        }
        .prediction-tai { color: #ffaa33; text-shadow: 0 0 6px #ff8800; }
        .prediction-xiu { color: #55ccff; text-shadow: 0 0 6px #00aaff; }
        button {
            background: #f0a500;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: #ffbc3c;
            transform: scale(0.97);
        }
        .timestamp {
            font-size: 0.65rem;
            color: #9bb8d4;
            margin-top: 20px;
        }
        .note {
            font-size: 0.7rem;
            margin-top: 18px;
            color: #a0b8cc;
        }
        @media (max-width: 500px) {
            .card { padding: 24px 18px; }
            .percent { font-size: 2rem; }
            .prediction-text { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎲 TÀI XỈU PRO 🎲</h1>
    <div class="sub">thuật toán xác suất động | chuẩn nhất</div>

    <div class="ratio-container">
        <div class="ratio-box">
            <div class="ratio-label tai-label">📈 TÀI</div>
            <div class="percent" id="taiPercent">0%</div>
        </div>
        <div class="ratio-box">
            <div class="ratio-label xiu-label">📉 XỈU</div>
            <div class="percent" id="xiuPercent">0%</div>
        </div>
    </div>

    <div class="prediction-box">
        <div style="font-size:0.85rem; opacity:0.8;">⚡ DỰ ĐOÁN LƯỢT TIẾP THEO ⚡</div>
        <div class="prediction-text" id="finalPrediction">---</div>
    </div>

    <button id="refreshBtn">
        <i class="fas fa-chart-line"></i> PHÂN TÍCH & DỰ ĐOÁN
    </button>
    <div class="timestamp" id="lastUpdate">--:--:--</div>
    <div class="note">
        📊 Thuật toán kết hợp: chuỗi Markov, xu hướng điểm, độ lệch, chu kỳ đảo chiều.<br>
        🔁 Tự động cập nhật mỗi 30 giây (dữ liệu lịch sử mới nhất).
    </div>
</div>

<script>
    // API URL lịch sử
    const API_URL = "https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=355f5391f1326f7cd9fa2ce5b8663d92";
    
    // Hàm lấy lịch sử (tối thiểu 30 ván)
    async function fetchHistory() {
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.list || data.list.length < 10) throw new Error("Không đủ dữ liệu");
            // trả về mảng lịch sử (mới nhất ở đầu), nhưng ta sẽ reverse để cũ->mới cho dễ tính chuỗi
            const history = [...data.list].reverse(); // từ cũ đến mới
            return history;
        } catch (err) {
            console.error(err);
            throw new Error("Lỗi lấy dữ liệu: " + err.message);
        }
    }

    // ========== THUẬT TOÁN XÁC SUẤT CHUẨN NHẤT ==========
    // Kết hợp 3 mô hình: Markov bậc 1 & 2, xu hướng điểm, độ lệch chuỗi
    function advancedPrediction(history) {
        if (!history.length) return { taiProb: 50, xiuProb: 50, decision: "TAI" };
        
        const total = history.length;
        let taiCount = history.filter(h => h.resultTruyenThong === "TAI").length;
        let xiuCount = total - taiCount;
        const baseRate = { tai: taiCount / total, xiu: xiuCount / total };
        
        // Lấy 10 ván gần nhất (sát nhất)
        const recent = history.slice(-15);
        const lastResult = history[history.length-1].resultTruyenThong;
        const secondLast = history.length>1 ? history[history.length-2].resultTruyenThong : null;
        
        // 1. Xác suất Markov bậc 1 (chuyển tiếp từ kết quả cuối)
        let markov1 = { tai: 0.5, xiu: 0.5 };
        if (history.length > 1) {
            let afterTai = 0, afterTaiTotal = 0;
            let afterXiu = 0, afterXiuTotal = 0;
            for (let i=0; i<history.length-1; i++) {
                let curr = history[i].resultTruyenThong;
                let next = history[i+1].resultTruyenThong;
                if (curr === "TAI") { afterTaiTotal++; if (next === "TAI") afterTai++; }
                else { afterXiuTotal++; if (next === "TAI") afterXiu++; }
            }
            markov1.tai = (lastResult === "TAI") ? (afterTai / afterTaiTotal) : (afterXiu / afterXiuTotal);
            markov1.xiu = 1 - markov1.tai;
            if (isNaN(markov1.tai)) markov1.tai = baseRate.tai;
            if (isNaN(markov1.xiu)) markov1.xiu = baseRate.xiu;
        }
        
        // 2. Xu hướng điểm số: điểm TB 5 ván gần nhất so với tổng thể
        const last5Points = recent.slice(-5).map(h => h.point);
        const avgLast5 = last5Points.reduce((a,b)=>a+b,0)/last5Points.length;
        const globalAvg = history.reduce((s,h)=>s+h.point,0)/total;
        const pointTrend = (avgLast5 - globalAvg); // dương => tài có xu hướng
        let pointBias = 0;
        if (pointTrend > 1.2) pointBias = 0.7;      // mạnh tài
        else if (pointTrend > 0.5) pointBias = 0.6;
        else if (pointTrend < -1.2) pointBias = -0.7; // xỉu
        else if (pointTrend < -0.5) pointBias = -0.6;
        else pointBias = 0;
        
        // 3. Chu kỳ đảo chiều (reversal pattern): nếu 2 ván cuối giống nhau => khả năng đảo cao
        let reversalBias = 0;
        if (secondLast && lastResult === secondLast) {
            // cặp đôi => xác suất đảo tăng
            reversalBias = (lastResult === "TAI") ? -0.15 : 0.15; // tài -> xỉu, xỉu -> tài
        } else if (secondLast && lastResult !== secondLast) {
            // đang đảo liên tục thì khả năng giữ đảo?
            let lastThree = recent.slice(-3).map(h=>h.resultTruyenThong);
            if (lastThree[0] !== lastThree[1] && lastThree[1] !== lastThree[2]) {
                // cầu 1-1-1?
                reversalBias = (lastResult === "TAI") ? -0.1 : 0.1; // tiếp tục đảo
            }
        }
        
        // 4. Tần suất xuất hiện Tài/Xỉu trong 10 ván gần (động lượng)
        let recentTai = recent.filter(h => h.resultTruyenThong === "TAI").length / recent.length;
        let momentum = (recentTai - baseRate.tai) * 0.4; // nếu gần đây tài nhiều -> tiếp tục xu hướng nhẹ
        
        // 5. Kết hợp các yếu tố thành xác suất tổng hợp (từ 0 đến 1)
        let combinedTai = baseRate.tai * 0.3 + markov1.tai * 0.4 + (pointBias > 0 ? pointBias*0.2 : 0) + momentum*0.1;
        // Điều chỉnh reversal bias
        combinedTai += reversalBias;
        // Giới hạn
        combinedTai = Math.min(0.95, Math.max(0.05, combinedTai));
        const taiProb = combinedTai * 100;
        const xiuProb = 100 - taiProb;
        
        // Quyết định dựa trên ngưỡng 55%
        let decision = (taiProb >= 55) ? "TAI" : (xiuProb >= 55) ? "XIU" : (taiProb > 50 ? "TAI" : "XIU");
        // Nếu hòa tuyệt đối, chọn theo base rate
        if (Math.abs(taiProb-xiuProb) < 2) decision = baseRate.tai >= 0.5 ? "TAI" : "XIU";
        
        return { taiProb: Math.round(taiProb), xiuProb: Math.round(xiuProb), decision };
    }
    
    // ========== HIỂN THỊ GIAO DIỆN ==========
    let isRefreshing = false;
    async function runPrediction() {
        if (isRefreshing) return;
        isRefreshing = true;
        const refreshBtn = document.getElementById('refreshBtn');
        const originalText = refreshBtn.innerHTML;
        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Đang phân tích...';
        refreshBtn.disabled = true;
        
        try {
            const history = await fetchHistory();
            if (!history.length) throw new Error("Không có dữ liệu lịch sử");
            const { taiProb, xiuProb, decision } = advancedPrediction(history);
            
            document.getElementById('taiPercent').innerHTML = taiProb + "%";
            document.getElementById('xiuPercent').innerHTML = xiuProb + "%";
            const predElem = document.getElementById('finalPrediction');
            predElem.innerHTML = decision;
            predElem.className = "prediction-text " + (decision === "TAI" ? "prediction-tai" : "prediction-xiu");
            document.getElementById('lastUpdate').innerHTML = `⏱️ cập nhật: ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            document.getElementById('finalPrediction').innerHTML = "ERROR";
            document.getElementById('taiPercent').innerHTML = "0%";
            document.getElementById('xiuPercent').innerHTML = "0%";
            document.getElementById('lastUpdate').innerHTML = `⚠️ ${err.message}`;
        } finally {
            refreshBtn.innerHTML = originalText;
            refreshBtn.disabled = false;
            isRefreshing = false;
        }
    }
    
    // Nút bấm
    document.getElementById('refreshBtn').addEventListener('click', runPrediction);
    // Tự động cập nhật mỗi 30 giây
    setInterval(() => {
        runPrediction();
    }, 300);
    
    // Gọi lần đầu
    runPrediction();
</script>
</body>
</html>
