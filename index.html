<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tool Dự Đoán Tài Xỉu - Mini + Kéo thả + Mã phiên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* tránh bôi đen khi kéo */
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #000;
        }

        /* iframe game full màn hình */
        .game-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* box dự đoán nhỏ gọn, có thể kéo thả */
        .mini-predictor {
            position: fixed;
            width: 150px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 193, 7, 0.7);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            z-index: 9999;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 10px 8px;
            transition: box-shadow 0.2s;
            cursor: default;
        }

        /* header dùng để kéo thả */
        .drag-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #ffd966;
            border-bottom: 1px solid #ffb34766;
            padding-bottom: 5px;
            margin-bottom: 8px;
            cursor: grab;
        }
        .drag-header:active {
            cursor: grabbing;
        }
        .robot-icon {
            font-size: 16px;
        }
        .title {
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .rotate-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
            width: 24px;
            height: 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rotate-btn:hover {
            background: #2c4c66;
            color: #ffaa33;
        }

        /* nội dung bên trong (có thể xoay) */
        .mini-content {
            transition: transform 0.2s ease;
        }
        .rotated-90 {
            transform: rotate(90deg);
        }

        /* mã phiên */
        .session {
            font-size: 0.65rem;
            background: #00000066;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            margin-bottom: 6px;
            color: #bbd4ff;
        }

        /* kết quả dự đoán lớn */
        .prediction {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFD966, #FF8C42);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px #ff8800aa;
            margin: 4px 0;
        }

        /* status nhỏ */
        .status {
            font-size: 0.55rem;
            color: #aaa;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* nút refresh nhỏ */
        .refresh-btn {
            background: #f0a500;
            border: none;
            width: 100%;
            border-radius: 40px;
            padding: 4px 0;
            font-size: 0.6rem;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #1e2f3c;
        }
        .refresh-btn:hover {
            background: #ffbc3c;
        }
    </style>
</head>
<body>

<!-- iframe game lc79.bet -->
<iframe class="game-frame" src="https://lc79.bet" title="LC79 Game" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

<!-- Box dự đoán nhỏ gọn, có thể kéo thả -->
<div id="miniBox" class="mini-predictor" style="top: 80px; right: 20px;">
    <div class="drag-header" id="dragHeader">
        <i class="fas fa-robot robot-icon"></i>
        <span class="title">Dự đoán</span>
        <button id="rotateBtn" class="rotate-btn"><i class="fas fa-sync-alt"></i></button>
    </div>
    <div class="mini-content" id="miniContent">
        <div id="sessionDisplay" class="session">Phiên: --</div>
        <div id="predictionResult" class="prediction">---</div>
        <div id="statusText" class="status">
            <i class="fas fa-spinner fa-pulse"></i> Đang chạy...
        </div>
        <button id="manualBtn" class="refresh-btn">
            <i class="fas fa-chart-simple"></i> Ngay
        </button>
    </div>
</div>

<script>
    // ========== API & THUẬT TOÁN ==========
    const API_URL = "https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=355f5391f1326f7cd9fa2ce5b8663d92";
    let isFetching = false;
    let lastPrediction = "";
    let lastSession = "";

    // Hàm lấy 4 ký tự cuối _id, lọc số
    function extractNumberFromLast4Id(idStr) {
        if (!idStr || idStr.length < 4) return 0;
        const last4 = idStr.slice(-4);
        const digits = last4.match(/\d/g);
        if (!digits) return 0;
        const combined = digits.join('');
        return combined === '' ? 0 : parseInt(combined, 10);
    }

    function isEven(num) {
        return num % 2 === 0;
    }

    function predictNext(prevResult, idNumber, thirdDice) {
        if (!prevResult) return "???";
        const sameParity = (isEven(idNumber) === isEven(thirdDice));
        if (sameParity) return prevResult;
        else return prevResult === "TAI" ? "XIU" : "TAI";
    }

    async function fetchAndUpdate() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data?.list?.length) throw new Error("No data");

            const latest = data.list[0];
            // Lấy id (mã phiên) và +1 để thành phiên hiện tại
            const currentSessionId = latest.id ? (latest.id + 1) : "?";
            const idRaw = latest._id;
            const dices = latest.dices;
            const resultTT = latest.resultTruyenThong;
            if (!dices || dices.length < 3) throw new Error("Invalid dice");
            const thirdDice = dices[2];
            const idNumber = extractNumberFromLast4Id(idRaw);
            const prediction = predictNext(resultTT, idNumber, thirdDice);

            // Cập nhật giao diện nếu thay đổi
            const sessionDiv = document.getElementById('sessionDisplay');
            const predDiv = document.getElementById('predictionResult');
            const statusDiv = document.getElementById('statusText');
            
            const sessionText = `Phiên: ${currentSessionId}`;
            if (sessionDiv.innerText !== sessionText) sessionDiv.innerText = sessionText;
            if (predDiv.innerText !== prediction) predDiv.innerText = prediction;
            
            statusDiv.innerHTML = `<i class="fas fa-clock"></i> ${new Date().toLocaleTimeString()} | ${prediction}`;
        } catch (err) {
            console.warn(err);
            const statusDiv = document.getElementById('statusText');
            if (!statusDiv.innerText.includes("Lỗi")) {
                statusDiv.innerHTML = `⚠️ Lỗi kết nối`;
            }
        } finally {
            isFetching = false;
        }
    }

    // ========== GỌI LIÊN TỤC 100ms ==========
    let interval = null;
    function startPolling() {
        if (interval) clearInterval(interval);
        fetchAndUpdate();
        interval = setInterval(fetchAndUpdate, 100);
    }
    startPolling();

    // nút bấm thủ công
    document.getElementById('manualBtn').addEventListener('click', () => {
        fetchAndUpdate();
    });

    // ========== KÉO THẢ BOX ==========
    const tool = document.getElementById('miniBox');
    const dragHeader = document.getElementById('dragHeader');
    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    function onMouseDown(e) {
        // Không kéo nếu bấm vào nút xoay
        if (e.target.closest('.rotate-btn')) return;
        isDragging = true;
        const rect = tool.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        tool.style.cursor = 'grabbing';
        e.preventDefault();
    }

    function onMouseMove(e) {
        if (!isDragging) return;
        let newLeft = e.clientX - offsetX;
        let newTop = e.clientY - offsetY;
        // giới hạn trong màn hình
        const maxX = window.innerWidth - tool.offsetWidth;
        const maxY = window.innerHeight - tool.offsetHeight;
        newLeft = Math.min(Math.max(0, newLeft), maxX);
        newTop = Math.min(Math.max(0, newTop), maxY);
        tool.style.left = newLeft + 'px';
        tool.style.top = newTop + 'px';
        tool.style.right = 'auto';
    }

    function onMouseUp() {
        isDragging = false;
        tool.style.cursor = '';
    }

    dragHeader.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    // Đảm bảo vị trí ban đầu nếu có style right
    const rect = tool.getBoundingClientRect();
    if (!tool.style.left && !tool.style.right) {
        tool.style.right = '20px';
        tool.style.top = '80px';
    }

    // ========== XOAY 90° ==========
    const rotateBtn = document.getElementById('rotateBtn');
    const miniContent = document.getElementById('miniContent');
    let rotated = false;
    rotateBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rotated = !rotated;
        if (rotated) {
            miniContent.classList.add('rotated-90');
        } else {
            miniContent.classList.remove('rotated-90');
        }
    });

    // dọn dẹp interval khi rời trang
    window.addEventListener('beforeunload', () => {
        if (interval) clearInterval(interval);
    });
</script>
</body>
</html>
